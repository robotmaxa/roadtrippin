<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Making AI Write My Code — Roadtrip Optimizer, four ways</title>
  <meta name="description" content="One project, one generic prompt, three AIs, four codebases. A study of specification versus prompting, with every codebase browsable.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- ?v= is a cache buster: browsers cache data.js/styles.css hard, so an
       edit can look like it never deployed. Bump this number on every push
       and every visitor gets the new files immediately. -->
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

  <header class="masthead">
    <div class="wrap">
      <p class="eyebrow" id="site-eyebrow"></p>
      <h1 id="site-title"></h1>
      <p class="masthead-tagline" id="site-tagline"></p>
    </div>

    <!-- Signature: the mile rail — the monotone progress invariant, drawn -->
    <div class="rail-band">
      <div class="wrap">
        <div class="rail" id="mile-rail" aria-label="Optimal route with strictly decreasing miles remaining"></div>
        <p class="rail-caption" id="rail-caption"></p>
      </div>
    </div>
  </header>

  <nav class="tabbar" aria-label="Sections">
    <div class="wrap tabbar-inner" id="tabbar"></div>
  </nav>

  <div class="wrap layout">
    <main id="main"></main>
    <aside class="data-rail" aria-label="Dataset">
      <details>
        <summary>western-usa.txt &mdash; the dataset</summary>
        <p class="data-note">The numbers in the middle (the count on each region header line)
          are campgrounds &mdash; irrelevant to the current project but will be used in a later phase.</p>
        <pre id="datafile-pre"></pre>
      </details>
    </aside>
  </div>

  <footer class="site-footer">
    <div class="wrap"><p id="site-footer-text"></p></div>
  </footer>

  <script src="data.js?v=5"></script>
  <script src="code/original.js?v=5"></script>
  <script src="code/claude-code.js?v=5"></script>
  <script src="code/codex.js?v=5"></script>
  <script src="code/copilot.js?v=5"></script>
  <script src="code/claude-code-2.js?v=5"></script>
  <script src="code/codex-2.js?v=5"></script>
  <script src="code/copilot-2.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
